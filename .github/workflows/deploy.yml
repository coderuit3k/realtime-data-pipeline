name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lambda packages
        run: ./scripts/build_lambdas.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - working-directory: infra
        run: terraform init

      - working-directory: infra
        run: terraform plan -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Configure this environment in the repo's Settings -> Environments with a
    # required reviewer, so every apply needs a human click before it runs.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build Lambda packages
        run: ./scripts/build_lambdas.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve tfplan
