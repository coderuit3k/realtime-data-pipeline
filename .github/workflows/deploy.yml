name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lambda packages
        run: ./scripts/build_lambdas.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Session tagging needs sts:TagSession in the trust policy too and
          # we don't use the tags for anything (no ABAC policies) -- skip it
          # rather than debug trust-policy/condition interaction further.
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - working-directory: infra
        run: terraform init

      - working-directory: infra
        run: terraform plan -out=tfplan

      # archive_file's output .zip files are ephemeral, local to this runner
      # -- terraform apply of a *saved* plan never re-evaluates data sources,
      # so it needs those exact zip bytes to still exist. Upload them
      # alongside the plan (confirmed via a live failed apply: rebuilding
      # from source in a separate job produces the zips in a different path
      # than what the saved plan recorded, so "no such file or directory").
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/tfplan
            infra/build/*.zip
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Configure this environment in the repo's Settings -> Environments with a
    # required reviewer, so every apply needs a human click before it runs.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # Restores infra/tfplan and infra/build/*.zip from the plan job -- no
      # need to rebuild, we're applying exactly what was already planned.
      # upload-artifact stores multi-path uploads relative to their common
      # ancestor ("infra/"), stripping it -- so download must target "infra"
      # to land them back at infra/tfplan and infra/build/*.zip (confirmed
      # via a live failed run: path "." put them at the repo root instead).
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve tfplan
